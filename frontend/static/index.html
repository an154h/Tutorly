<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorly</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary':                  '#6e5275',
            'primary-container':        '#f5d1fb',
            'on-primary':               '#ffedfe',
            'on-primary-container':     '#604567',
            'primary-fixed':            '#f5d1fb',
            'secondary':                '#2a646a',
            'secondary-container':      '#aee7ee',
            'on-secondary-container':   '#19565c',
            'tertiary':                 '#47624b',
            'tertiary-container':       '#ddfcde',
            'on-tertiary-container':    '#48624b',
            'surface':                  '#fef6e7',
            'surface-container':        '#f0e7d6',
            'surface-container-low':    '#f8f0e0',
            'surface-container-high':   '#eae2d0',
            'surface-container-highest':'#e5dcc9',
            'surface-container-lowest': '#ffffff',
            'surface-variant':          '#e5dcc9',
            'on-surface':               '#322e25',
            'on-surface-variant':       '#605b50',
            'outline':                  '#7c766a',
            'outline-variant':          '#b3ac9f',
            'inverse-surface':          '#110e06',
            'background':               '#fef6e7',
            'error':                    '#b41340',
            'error-container':          '#f74b6d',
            'on-error-container':       '#510017',
          },
          fontFamily: {
            'headline': ['Plus Jakarta Sans', 'sans-serif'],
            'body':     ['Manrope', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: '0.25rem',
            lg:      '0.5rem',
            xl:      '0.75rem',
            '2xl':   '1rem',
            '3xl':   '1.5rem',
            full:    '9999px',
          },
        },
      },
    };
  </script>

  <!-- React + Babel + Chart.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <style>
    /* Material Symbols baseline */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      white-space: nowrap;
    }

    /* Neo-brutalism shadow utilities */
    .neo-shadow        { box-shadow: 4px 4px 0px #110e06; }
    .neo-shadow-sm     { box-shadow: 2px 2px 0px #110e06; }
    .neo-shadow-lg     { box-shadow: 6px 6px 0px #110e06; }

    .neo-shadow-hover:hover {
      box-shadow: 6px 6px 0px #110e06;
      transform: translate(-2px, -2px);
    }
    .neo-shadow-active:active {
      box-shadow: 0px 0px 0px #110e06;
      transform: translate(4px, 4px);
    }

    /* 2px solid #110e06 border — the "scribble border" rule */
    .scribble-border { border: 2px solid #110e06; }

    /* Page entry animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Bounce dots for chat thinking indicator */
    @keyframes dotBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    .dot-bounce { animation: dotBounce 0.8s ease-in-out infinite; }

    /* Global base */
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #fef6e7;
      color: #322e25;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = 'http://localhost:8000/api';

    function renderMarkdown(text) {
      const html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code style="background:rgba(0,0,0,0.07);padding:0.1em 0.3em;border-radius:4px;font-family:monospace;font-size:0.85em">$1</code>')
        .replace(/\n/g, '<br/>');
      return { __html: html };
    }

    const getToken   = () => localStorage.getItem('tutorly_token');
    const getStudent = () => { try { return JSON.parse(localStorage.getItem('tutorly_student') || 'null'); } catch { return null; } };
    const setAuth    = (s) => { localStorage.setItem('tutorly_token', s.session_token); localStorage.setItem('tutorly_student', JSON.stringify(s)); };
    const clearAuth  = () => { localStorage.removeItem('tutorly_token'); localStorage.removeItem('tutorly_student'); };

    async function api(path, opts = {}) {
      const token = getToken();
      const headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}), ...(opts.headers || {}) };
      const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function parseHash() {
      const raw = window.location.hash.replace(/^#/, '') || '';
      const [page, qs] = raw.split('?');
      const params = {};
      if (qs) qs.split('&').forEach(p => { const [k, v] = p.split('='); params[k] = decodeURIComponent(v || ''); });
      return { page: page || 'home', params };
    }
    function navigate(page, params = {}) {
      const qs = Object.keys(params).length ? '?' + Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&') : '';
      window.location.hash = `#${page}${qs}`;
    }

    /* ── Navbar ─────────────────────────────────────────────────────── */
    function Navbar({ page }) {
      const student = getStudent();
      return (
        <nav className="bg-surface border-b-2 border-[#110e06] sticky top-0 z-50 flex justify-between items-center px-6 py-4">
          <div className="flex items-center gap-8">
            <span className="font-headline font-black text-2xl italic tracking-tight text-[#110e06]">
              Tutorly
            </span>
            <div className="hidden md:flex gap-6 items-center">
              <a
                href="#home"
                className={`font-bold text-sm transition-all hover:translate-x-[2px] hover:translate-y-[2px] ${page === 'home' ? 'border-b-4 border-[#110e06] text-[#110e06]' : 'text-on-surface hover:text-primary'}`}
              >
                Home
              </a>
              <a
                href="#dashboard"
                className={`font-bold text-sm transition-all hover:translate-x-[2px] hover:translate-y-[2px] ${page === 'dashboard' ? 'border-b-4 border-[#110e06] text-[#110e06]' : 'text-on-surface hover:text-primary'}`}
              >
                Dashboard
              </a>
            </div>
          </div>
          <div className="flex items-center gap-3">
            {student && (
              <span className="bg-surface-container-lowest scribble-border px-3 py-1 rounded-lg font-bold text-sm neo-shadow-sm">
                {student.name}
              </span>
            )}
            <button
              className="bg-surface-container scribble-border px-3 py-1 rounded-lg font-bold text-sm neo-shadow-hover neo-shadow-active transition-all"
              onClick={() => { clearAuth(); navigate('login'); }}
            >
              Logout
            </button>
          </div>
        </nav>
      );
    }

    /* ── Login ──────────────────────────────────────────────────────── */
    function LoginPage() {
      const [name,    setName]    = React.useState('');
      const [email,   setEmail]   = React.useState('');
      const [error,   setError]   = React.useState('');
      const [loading, setLoading] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name.trim() || !email.trim()) { setError('Please enter your name and email.'); return; }
        setLoading(true); setError('');
        try {
          const student = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ name: name.trim(), email: email.trim().toLowerCase() }),
          });
          setAuth(student);
          navigate('home');
        } catch (err) {
          setError(err.message || 'Something went wrong. Please try again.');
        } finally { setLoading(false); }
      };

      return (
        <div className="min-h-screen bg-primary-container font-body text-on-surface flex flex-col overflow-x-hidden">
          {/* Simplified header */}
          <header className="bg-surface border-b-2 border-[#110e06] flex justify-between items-center px-6 py-4">
            <span className="font-headline font-black text-2xl italic tracking-tight text-[#110e06]">Tutorly</span>
          </header>

          <main className="flex-grow flex items-center justify-center p-6 relative">
            {/* Decorative floating card — top right */}
            <div className="hidden lg:block absolute top-10 right-10 -rotate-12 transition-transform hover:rotate-0 duration-300">
              <div className="bg-tertiary-container scribble-border p-5 rounded-xl neo-shadow flex flex-col items-center gap-2">
                <span className="text-4xl">📚</span>
                <span className="font-headline font-extrabold text-on-tertiary-container uppercase tracking-widest text-xs">Study Hard!</span>
              </div>
            </div>

            {/* Decorative floating card — bottom left */}
            <div className="hidden lg:block absolute bottom-10 left-10 rotate-6 transition-transform hover:rotate-0 duration-300">
              <div className="bg-secondary-container scribble-border p-5 rounded-xl neo-shadow flex flex-col items-center gap-2">
                <span className="text-4xl">🧠</span>
                <span className="font-headline font-extrabold text-on-secondary-container uppercase tracking-widest text-xs">Think Deep!</span>
              </div>
            </div>

            {/* Login container */}
            <div className="max-w-md w-full flex flex-col gap-8 relative z-10">
              <div className="text-center space-y-2 fade-up">
                <h1 className="font-headline font-extrabold text-4xl md:text-5xl text-[#110e06] tracking-tight leading-tight">
                  Ready to crush your O-levels?
                </h1>
                <p className="text-lg font-medium opacity-80">
                  An AI Socratic tutor for Brunei O-Level exam prep. Think, don't memorise.
                </p>
              </div>

              {/* Login card */}
              <div className="bg-surface scribble-border rounded-[2rem] p-8 md:p-10 neo-shadow fade-up" style={{ animationDelay: '80ms' }}>
                <h2 className="font-headline font-black text-xl text-[#110e06] mb-6">Start studying →</h2>

                {error && (
                  <div className="bg-error-container scribble-border rounded-xl px-4 py-3 font-bold text-sm text-on-error-container mb-4">
                    {error}
                  </div>
                )}

                <form className="space-y-5" onSubmit={handleSubmit}>
                  <div className="space-y-2">
                    <label className="font-headline font-bold text-sm flex items-center gap-2" htmlFor="login-name">
                      <span className="material-symbols-outlined text-primary text-lg">person</span>
                      Your Name
                    </label>
                    <input
                      id="login-name"
                      type="text"
                      placeholder="e.g. Ahmad Rizal"
                      value={name}
                      onChange={e => setName(e.target.value)}
                      className="w-full bg-surface-container-lowest scribble-border rounded-xl px-5 py-4 outline-none font-medium placeholder:text-outline-variant transition-all focus:shadow-[0_0_0_3px_rgba(110,82,117,0.2)]"
                    />
                  </div>

                  <div className="space-y-2">
                    <label className="font-headline font-bold text-sm flex items-center gap-2" htmlFor="login-email">
                      <span className="material-symbols-outlined text-primary text-lg">alternate_email</span>
                      Email Address
                    </label>
                    <input
                      id="login-email"
                      type="email"
                      placeholder="you@example.com"
                      value={email}
                      onChange={e => setEmail(e.target.value)}
                      className="w-full bg-surface-container-lowest scribble-border rounded-xl px-5 py-4 outline-none font-medium placeholder:text-outline-variant transition-all focus:shadow-[0_0_0_3px_rgba(110,82,117,0.2)]"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-tertiary-container scribble-border py-4 rounded-xl font-headline font-black text-xl text-on-tertiary-container neo-shadow neo-shadow-hover neo-shadow-active transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    {loading ? 'Signing in…' : 'Get Started Learning'}
                    {!loading && <span className="material-symbols-outlined" style={{ fontVariationSettings: "'FILL' 1" }}>bolt</span>}
                  </button>
                </form>

                <div className="mt-8 pt-6 border-t-2 border-dashed border-outline-variant">
                  <div className="flex flex-wrap gap-2 justify-center">
                    {['📐 Mathematics', '📖 English', '🔬 Biology', '🌍 Geography'].map(s => (
                      <span key={s} className="bg-surface-container scribble-border px-3 py-1 rounded-lg text-sm font-bold text-on-surface-variant">
                        {s}
                      </span>
                    ))}
                  </div>
                </div>
              </div>

              <p className="text-center font-bold text-on-primary-container opacity-90 text-sm italic fade-up" style={{ animationDelay: '160ms' }}>
                "The mind is not a vessel to be filled, but a fire to be kindled."
              </p>
            </div>
          </main>
        </div>
      );
    }

    /* ── Home ───────────────────────────────────────────────────────── */
    function HomePage() {
      const [subjects, setSubjects] = React.useState([]);
      const [loading,  setLoading]  = React.useState(true);
      const [error,    setError]    = React.useState('');

      React.useEffect(() => {
        api('/subjects').then(setSubjects).catch(e => setError(e.message)).finally(() => setLoading(false));
      }, []);

      const cardFills = [
        'bg-primary-container',
        'bg-secondary-container',
        'bg-tertiary-container',
      ];

      if (loading) return (
        <>
          <Navbar page="home" />
          <div className="flex items-center justify-center min-h-[60vh] font-body text-on-surface-variant font-bold">
            Loading subjects…
          </div>
        </>
      );

      if (error) return (
        <>
          <Navbar page="home" />
          <div className="max-w-7xl mx-auto px-6 py-12">
            <div className="bg-error-container scribble-border rounded-xl px-4 py-3 font-bold text-sm text-on-error-container">{error}</div>
          </div>
        </>
      );

      return (
        <>
          <Navbar page="home" />
          <main className="bg-surface min-h-screen px-6 py-12 max-w-7xl mx-auto w-full">
            {/* Hero heading */}
            <div className="mb-12 fade-up">
              <div className="inline-block bg-primary-container scribble-border px-4 py-1 mb-4 rounded-full neo-shadow-sm">
                <span className="text-xs font-headline font-black uppercase tracking-widest text-on-primary-container">
                  O-Level Prep
                </span>
              </div>
              <h1 className="font-headline font-black text-6xl md:text-8xl tracking-tighter leading-none mb-4 text-[#110e06]">
                Where should<br />
                <span className="text-primary italic">we start?</span>
              </h1>
              <p className="text-xl font-medium text-on-surface-variant max-w-xl">
                Choose a subject to browse AI-predicted past-year exam questions.
              </p>
            </div>

            {/* Subject grid */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {subjects.map((s, idx) => (
                <div
                  key={s.id}
                  className={`${cardFills[idx % 3]} scribble-border rounded-2xl p-8 flex flex-col h-full neo-shadow neo-shadow-hover transition-all fade-up`}
                  style={{ animationDelay: `${idx * 80}ms` }}
                >
                  <div className="text-5xl mb-4">{s.icon}</div>
                  <div className="font-body text-xs text-outline uppercase tracking-widest mb-1">{s.code}</div>
                  <h3 className="font-headline font-extrabold text-2xl mb-4 text-[#110e06]">{s.name}</h3>
                  <button
                    className="mt-auto w-full bg-inverse-surface text-surface scribble-border py-3 rounded-xl font-headline font-bold neo-shadow-hover neo-shadow-active transition-all"
                    onClick={() => navigate('topics', { subject: s.id })}
                  >
                    Revise →
                  </button>
                </div>
              ))}
            </div>
          </main>
        </>
      );
    }

    /* ── Topics ─────────────────────────────────────────────────────── */
    function TopicsPage({ params }) {
  const subjectId = parseInt(params.subject, 10);
  const [topics,    setTopics]    = React.useState([]);
  const [questions, setQuestions] = React.useState([]);
  const [activeTab, setActiveTab] = React.useState(null);
  const [loading,   setLoading]   = React.useState(true);
  const [qLoading,  setQLoading]  = React.useState(false);
  const [error,     setError]     = React.useState('');

  React.useEffect(() => {
    api(`/subjects/${subjectId}/topics`)
      .then(t => { setTopics(t); if (t.length > 0) setActiveTab(t[0].id); })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }, [subjectId]);

  React.useEffect(() => {
    if (!activeTab) return;
    setQLoading(true);
    api(`/topics/${activeTab}/questions`)
      .then(setQuestions)
      .catch(e => setError(e.message))
      .finally(() => setQLoading(false));
  }, [activeTab]);

  const cardFills = [
    'bg-tertiary-container',
    'bg-primary-container',
    'bg-[#fef08a]',
    'bg-secondary-container',
    'bg-[#ddfcde]',
  ];

  const difficultyColors = {
    easy:   'text-on-tertiary-container',
    medium: 'text-on-primary-container',
    hard:   'text-error',
  };

  if (loading) return (
    <>
      <Navbar page="topics" />
      <div className="flex items-center justify-center min-h-[60vh] font-body text-on-surface-variant font-bold">Loading…</div>
    </>
  );

  if (error) return (
    <>
      <Navbar page="topics" />
      <div className="max-w-7xl mx-auto px-6 py-12">
        <div className="bg-error-container scribble-border rounded-xl px-4 py-3 font-bold text-sm text-on-error-container">{error}</div>
      </div>
    </>
  );

  return (
    <>
      <Navbar page="topics" />
      <main className="bg-surface min-h-screen px-6 py-12 max-w-7xl mx-auto w-full">
        {/* Back button */}
        <button
          className="bg-surface-container scribble-border px-4 py-2 rounded-xl font-bold text-sm mb-8 neo-shadow-hover neo-shadow-active transition-all"
          onClick={() => navigate('home')}
        >
          ← Back to subjects
        </button>

        {/* Hero heading */}
        <div className="mb-10 relative">
          <div className="inline-block bg-primary-container scribble-border px-4 py-1 mb-4 rounded-full neo-shadow-sm">
            <span className="text-xs font-headline font-black uppercase tracking-widest text-on-primary-container">Exam Pulse</span>
          </div>
          <h1 className="font-headline font-black text-6xl md:text-8xl tracking-tighter leading-none mb-4 text-[#110e06]">
            Predicted <br />
            <span className="text-primary italic">Questions.</span>
          </h1>
          <p className="text-xl font-medium text-on-surface-variant max-w-2xl">
            Ranked by frequency, recency &amp; mark weight.
          </p>
          {/* Decorative circle */}
          <div className="absolute top-0 right-0 hidden lg:flex w-40 h-40 bg-secondary-container scribble-border rounded-full items-center justify-center -rotate-12 neo-shadow">
            <span className="material-symbols-outlined text-5xl" style={{ fontVariationSettings: "'FILL' 1" }}>psychology</span>
          </div>
        </div>

        {/* Topic tabs */}
        <div className="flex flex-wrap gap-3 mb-10 overflow-x-auto pb-2">
          {topics.map(t => (
            <button
              key={t.id}
              onClick={() => setActiveTab(t.id)}
              className={`px-6 py-2 scribble-border rounded-xl font-headline font-bold text-base transition-all neo-shadow-active
                ${activeTab === t.id
                  ? 'bg-secondary-container text-on-secondary-container neo-shadow'
                  : 'bg-surface text-on-surface hover:bg-surface-container hover:translate-x-[2px] hover:translate-y-[2px]'
                }`}
            >
              {t.name}
            </button>
          ))}
        </div>

        {/* Questions grid */}
        {qLoading ? (
          <div className="flex items-center justify-center py-16 font-body text-on-surface-variant font-bold">Loading questions…</div>
        ) : questions.length === 0 ? (
          <div className="text-center py-16 font-body text-on-surface-variant font-bold">No questions for this topic yet.</div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {questions.map((q, idx) => (
              <div
                key={q.id}
                className={`${cardFills[idx % cardFills.length]} scribble-border rounded-2xl p-6 flex flex-col h-full neo-shadow-hover transition-all cursor-pointer fade-up`}
                style={{ animationDelay: `${idx * 45}ms` }}
                onClick={() => navigate('question', { id: q.id })}
              >
                {/* Top row: difficulty + years */}
                <div className="flex justify-between items-start mb-6">
                  <div className={`bg-surface-container-lowest scribble-border px-3 py-1 rounded-lg font-headline font-black text-xs uppercase ${difficultyColors[q.difficulty] || ''}`}>
                    {q.difficulty}
                  </div>
                  <div className="flex gap-1 flex-wrap justify-end">
                    {(q.years_appeared || []).map(y => (
                      <span key={y} className="px-2 py-1 bg-[#110e06] text-white text-[10px] font-bold rounded">{y}</span>
                    ))}
                  </div>
                </div>

                {/* Question text */}
                <h3 className="font-headline font-black text-xl leading-tight mb-4 text-[#110e06]">
                  {q.question_text.length > 140 ? q.question_text.slice(0, 140) + '…' : q.question_text}
                </h3>

                {/* Probability bar */}
                <div className="mt-auto pt-6 border-t-2 border-[#110e06]/10">
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-sm font-bold uppercase tracking-tight text-on-surface-variant">Predicted Probability</span>
                    <span className="text-lg font-headline font-black italic text-[#110e06]">
                      {parseFloat(q.predicted_score).toFixed(0)}%
                    </span>
                  </div>
                  <div className="h-4 bg-surface-variant scribble-border rounded-full overflow-hidden">
                    <div className="h-full bg-secondary transition-all" style={{ width: `${q.predicted_score}%` }} />
                  </div>
                  <div className="mt-3 flex gap-2 items-center">
                    <span className="bg-surface-container-lowest scribble-border px-2 py-0.5 rounded font-bold text-xs text-on-surface">
                      {q.marks} mark{q.marks !== 1 ? 's' : ''}
                    </span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </main>
    </>
  );
}

    /* ── Question room ──────────────────────────────────────────────── */
    function QuestionPage({ params }) {
  const questionId = parseInt(params.id, 10);

  const [question,   setQuestion]   = React.useState(null);
  const [messages,   setMessages]   = React.useState([]);
  const [input,      setInput]      = React.useState('');
  const [sending,    setSending]    = React.useState(false);
  const [attemptId,  setAttemptId]  = React.useState(null);
  const [sessionId,  setSessionId]  = React.useState(null);
  const [loading,    setLoading]    = React.useState(true);
  const [error,      setError]      = React.useState('');
  const [showModal,  setShowModal]  = React.useState(false);
  const [confidence, setConfidence] = React.useState(0);
  const [submitting, setSubmitting] = React.useState(false);
  const [showAnswer, setShowAnswer] = React.useState(false);

  const messagesEndRef = React.useRef(null);

  React.useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  React.useEffect(() => {
    (async () => {
      try {
        const q       = await api(`/questions/${questionId}`);
        const attempt = await api('/attempts', { method: 'POST', body: JSON.stringify({ question_id: questionId }) });
        const session = await api('/chat/session', { method: 'POST', body: JSON.stringify({ question_id: questionId, attempt_id: attempt.id }) });
        setQuestion(q); setAttemptId(attempt.id); setSessionId(session.id);
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
    })();
  }, [questionId]);

  const sendMessage = async (text) => {
    const msg = text || input.trim();
    if (!msg || sending) return;
    setInput('');
    setMessages(prev => [...prev, { role: 'user', content: msg }, { role: 'thinking' }]);
    setSending(true);
    try {
      const res = await api(`/chat/session/${sessionId}/message`, {
        method: 'POST',
        body: JSON.stringify({ message: msg }),
      });
      setMessages(prev => prev.filter(m => m.role !== 'thinking').concat({ role: 'assistant', content: res.content }));
    } catch {
      setMessages(prev => prev.filter(m => m.role !== 'thinking').concat({ role: 'assistant', content: '⚠️ Could not reach the AI. Please try again.' }));
    } finally { setSending(false); }
  };

  const handleDone = async () => {
    if (!confidence) { setShowModal(true); return; }
    setSubmitting(true);
    try {
      await api(`/attempts/${attemptId}`, {
        method: 'PATCH',
        body: JSON.stringify({ self_rated_confidence: confidence, completed_at: new Date().toISOString() }),
      });
      setShowModal(false); setShowAnswer(true);
    } catch { setSubmitting(false); }
  };

  if (loading) return (
    <>
      <Navbar page="question" />
      <div className="flex items-center justify-center min-h-[60vh] font-body text-on-surface-variant font-bold">Preparing your question…</div>
    </>
  );

  if (error) return (
    <>
      <Navbar page="question" />
      <div className="max-w-7xl mx-auto px-6 py-12">
        <div className="bg-error-container scribble-border rounded-xl px-4 py-3 font-bold text-sm text-on-error-container">{error}</div>
      </div>
    </>
  );

  return (
    <>
      <Navbar page="question" />
      <div className="flex h-[calc(100vh-64px)] overflow-hidden">

        {/* ── Left: Question Panel ───────────────────────────── */}
        <section className="w-1/2 bg-surface border-r-2 border-[#110e06] flex flex-col overflow-y-auto p-8">
          {/* Top row: back + done */}
          <div className="flex justify-between items-center mb-6">
            <button
              className="bg-surface-container scribble-border px-4 py-2 rounded-xl font-bold text-sm neo-shadow-hover neo-shadow-active transition-all"
              onClick={() => navigate('home')}
            >
              ← Back
            </button>
            <button
              className="bg-secondary-container scribble-border px-4 py-2 rounded-xl font-headline font-bold text-sm neo-shadow neo-shadow-hover neo-shadow-active transition-all"
              onClick={handleDone}
            >
              I'm Done ✓
            </button>
          </div>

          {/* Active lesson badge */}
          <span className="bg-primary-container scribble-border px-3 py-1 rounded-full font-headline font-black text-xs uppercase tracking-widest text-on-primary-container self-start mb-4">
            Active Lesson
          </span>

          {/* Subject / topic */}
          <p className="text-xs font-bold text-outline uppercase tracking-widest mb-2">
            {question.subject_name} › {question.topic_name}
          </p>

          {/* Question card */}
          <div className="bg-surface-container-lowest scribble-border rounded-2xl p-6 neo-shadow relative overflow-hidden mb-6">
            <div className="absolute top-0 right-0 p-4 opacity-10">
              <span className="material-symbols-outlined text-6xl">quiz</span>
            </div>
            {/* Badges */}
            <div className="flex gap-2 mb-4 flex-wrap">
              <span className="bg-surface-container-lowest scribble-border px-3 py-1 rounded-lg font-headline font-black text-xs uppercase">
                {question.difficulty}
              </span>
              <span className="bg-surface-container scribble-border px-3 py-1 rounded-lg font-bold text-xs">
                {question.marks} mark{question.marks !== 1 ? 's' : ''}
              </span>
            </div>

            {question.image_url && (
              <img className="w-full rounded-xl scribble-border mb-4 object-cover max-h-48" src={question.image_url} alt="Question diagram" />
            )}

            <p className="text-xl leading-relaxed font-medium text-[#110e06]">{question.question_text}</p>

            {/* Years */}
            {(question.years_appeared || []).length > 0 && (
              <div className="mt-6">
                <p className="text-xs font-bold text-outline uppercase tracking-widest mb-2">Appeared in:</p>
                <div className="flex flex-wrap gap-2">
                  {question.years_appeared.map(y => (
                    <span key={y} className="px-2 py-1 bg-[#110e06] text-white text-[10px] font-bold rounded">{y}</span>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Answer reveal */}
          {showAnswer && question.answer && (
            <div className="bg-tertiary-container scribble-border rounded-2xl p-6 neo-shadow mb-4">
              <p className="text-xs font-headline font-black uppercase tracking-widest text-tertiary mb-3">✅ Model Answer</p>
              <p className="text-base leading-relaxed text-on-tertiary-container">{question.answer}</p>
            </div>
          )}

          {showAnswer && (
            <button
              className="w-full bg-inverse-surface text-surface scribble-border py-3 rounded-xl font-headline font-bold neo-shadow neo-shadow-hover neo-shadow-active transition-all"
              onClick={() => navigate('home')}
            >
              ← Back to Home
            </button>
          )}
        </section>

        {/* ── Right: Chat Panel ─────────────────────────────── */}
        <section className="w-1/2 bg-surface-container-low flex flex-col">
          {/* Chat header */}
          <div className="bg-surface border-b-2 border-[#110e06] flex items-center justify-between px-5 py-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-primary rounded-full border-2 border-[#110e06] flex items-center justify-center">
                <span className="material-symbols-outlined text-on-primary text-lg">smart_toy</span>
              </div>
              <div>
                <p className="font-headline font-black text-sm leading-none">Tutorly AI Tutor</p>
                <p className="text-[10px] font-bold text-secondary flex items-center gap-1 mt-0.5">
                  <span className="w-2 h-2 bg-secondary rounded-full inline-block" />
                  Socratic mode
                </p>
              </div>
            </div>
            <button
              className="bg-tertiary-container scribble-border px-3 py-1 rounded-lg font-bold text-sm neo-shadow-hover neo-shadow-active transition-all"
              onClick={() => sendMessage('Can I have a hint?')}
              disabled={sending}
            >
              💡 Hint
            </button>
          </div>

          {/* Messages */}
          <div className="flex-grow overflow-y-auto p-5 space-y-5">
            {messages.length === 0 && (
              <div className="bg-surface-container-highest scribble-border rounded-2xl p-4 neo-shadow max-w-[85%]">
                <p className="font-medium text-on-surface">
                  Hi! I'm here to help you work through this question. Have a go at it first — what do you think the answer might be?
                </p>
              </div>
            )}
            {messages.map((m, i) => {
              if (m.role === 'thinking') return (
                <div key={i} className="flex gap-1 ml-2">
                  {[0, 0.2, 0.4].map((delay, di) => (
                    <div key={di} className="w-2 h-2 bg-outline rounded-full dot-bounce" style={{ animationDelay: `${delay}s` }} />
                  ))}
                </div>
              );
              if (m.role === 'user') return (
                <div key={i} className="flex flex-col items-end">
                  <div className="bg-secondary-container scribble-border rounded-2xl p-4 neo-shadow max-w-[85%] self-end fade-up">
                    <p className="font-medium text-on-secondary-container">{m.content}</p>
                  </div>
                </div>
              );
              return (
                <div key={i} className="flex flex-col items-start">
                  <div className="bg-surface-container-highest scribble-border rounded-2xl p-4 neo-shadow max-w-[85%] fade-up">
                    <p className="font-medium text-on-surface" dangerouslySetInnerHTML={renderMarkdown(m.content)} />
                  </div>
                </div>
              );
            })}
            <div ref={messagesEndRef} />
          </div>

          {/* Input area */}
          <div className="bg-surface border-t-2 border-[#110e06] p-4">
            <div className="flex gap-3">
              <textarea
                className="flex-grow bg-surface-container-lowest scribble-border rounded-xl p-4 font-medium resize-none outline-none h-[58px] focus:shadow-[0_0_0_3px_rgba(110,82,117,0.2)] transition-all placeholder:text-outline-variant"
                placeholder="Type your answer here…"
                rows={1}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
              />
              <button
                className="bg-primary scribble-border rounded-xl p-4 neo-shadow neo-shadow-hover neo-shadow-active transition-all flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed"
                onClick={() => sendMessage()}
                disabled={sending || !input.trim()}
              >
                <span className="material-symbols-outlined text-on-primary">send</span>
              </button>
            </div>
            <p className="text-[10px] font-headline font-black uppercase tracking-tight text-outline text-right mt-2">
              Powered by Tutorly AI
            </p>
          </div>
        </section>
      </div>

      {/* ── Confidence modal ──────────────────────────────── */}
      {showModal && (
        <div
          className="fixed inset-0 z-50 bg-[#110e06]/40 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}
        >
          <div className="bg-surface scribble-border rounded-[2rem] p-8 neo-shadow max-w-sm w-full text-center fade-up">
            <h2 className="font-headline font-black text-2xl mb-2 text-[#110e06]">How confident do you feel?</h2>
            <p className="font-medium text-on-surface-variant mb-6">Rate your understanding before moving on.</p>
            <div className="flex justify-center gap-3 mb-6">
              {[1,2,3,4,5].map(n => (
                <button
                  key={n}
                  onClick={() => setConfidence(n)}
                  className={`text-3xl transition-all ${confidence >= n ? 'scale-125' : 'opacity-30 grayscale'}`}
                >
                  ⭐
                </button>
              ))}
            </div>
            <div className="flex gap-3 justify-center">
              <button
                className="bg-surface-container scribble-border px-5 py-2 rounded-xl font-bold neo-shadow-hover neo-shadow-active transition-all"
                onClick={() => setShowModal(false)}
              >
                Cancel
              </button>
              <button
                className="bg-tertiary-container scribble-border px-5 py-2 rounded-xl font-headline font-bold neo-shadow neo-shadow-hover neo-shadow-active transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                disabled={!confidence || submitting}
                onClick={handleDone}
              >
                {submitting ? 'Saving…' : 'Done ✓'}
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

    /* ── App router ─────────────────────────────────────────────────── */
    function App() {
      const [route, setRoute] = useState(parseHash());

      useEffect(() => {
        const onHash = () => setRoute(parseHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const { page, params } = route;
      const token = getToken();

      if (!token && page !== 'login') { setTimeout(() => navigate('login'), 0); return null; }
      if (token  && page === 'login') { setTimeout(() => navigate('home'),  0); return null; }

      if (page === 'login')     return <LoginPage />;
      if (page === 'home')      return <HomePage />;
      if (page === 'topics')    return <TopicsPage params={params} />;
      if (page === 'question')  return <QuestionPage params={params} />;
      if (page === 'dashboard') return <DashboardPage />;

      setTimeout(() => navigate('home'), 0);
      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
