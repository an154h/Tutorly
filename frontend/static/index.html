<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorly</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary':                  '#6e5275',
            'primary-container':        '#f5d1fb',
            'on-primary':               '#ffedfe',
            'on-primary-container':     '#604567',
            'primary-fixed':            '#f5d1fb',
            'secondary':                '#2a646a',
            'secondary-container':      '#aee7ee',
            'on-secondary-container':   '#19565c',
            'tertiary':                 '#47624b',
            'tertiary-container':       '#ddfcde',
            'on-tertiary-container':    '#48624b',
            'surface':                  '#fef6e7',
            'surface-container':        '#f0e7d6',
            'surface-container-low':    '#f8f0e0',
            'surface-container-high':   '#eae2d0',
            'surface-container-highest':'#e5dcc9',
            'surface-container-lowest': '#ffffff',
            'surface-variant':          '#e5dcc9',
            'on-surface':               '#322e25',
            'on-surface-variant':       '#605b50',
            'outline':                  '#7c766a',
            'outline-variant':          '#b3ac9f',
            'inverse-surface':          '#110e06',
            'background':               '#fef6e7',
            'error':                    '#b41340',
            'error-container':          '#f74b6d',
            'on-error-container':       '#510017',
          },
          fontFamily: {
            'headline': ['Plus Jakarta Sans', 'sans-serif'],
            'body':     ['Manrope', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: '0.25rem',
            lg:      '0.5rem',
            xl:      '0.75rem',
            '2xl':   '1rem',
            '3xl':   '1.5rem',
            full:    '9999px',
          },
        },
      },
    };
  </script>

  <!-- React + Babel + Chart.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <style>
    /* Material Symbols baseline */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      white-space: nowrap;
    }

    /* Neo-brutalism shadow utilities */
    .neo-shadow        { box-shadow: 4px 4px 0px #110e06; }
    .neo-shadow-sm     { box-shadow: 2px 2px 0px #110e06; }
    .neo-shadow-lg     { box-shadow: 6px 6px 0px #110e06; }

    .neo-shadow-hover:hover {
      box-shadow: 6px 6px 0px #110e06;
      transform: translate(-2px, -2px);
    }
    .neo-shadow-active:active {
      box-shadow: 0px 0px 0px #110e06;
      transform: translate(4px, 4px) scale(0.97);
    }

    /* Input focus — no layout-triggering properties */
    .input-field {
      transition: box-shadow 150ms ease-out;
    }
    .input-field:focus {
      box-shadow: 0 0 0 3px rgba(110, 82, 117, 0.2);
    }

    /* Error banner entry */
    .error-banner {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 150ms ease-out, transform 150ms ease-out;
    }
    @supports (selector(:has(*))) {
      @starting-style {
        .error-banner {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
    }

    /* Decorative card hover — only on pointer devices */
    @media (hover: hover) and (pointer: fine) {
      .deco-card {
        transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .deco-card:hover {
        transform: rotate(0deg) !important;
      }
    }

    /* 2px solid #110e06 border — the "scribble border" rule */
    .scribble-border { border: 2px solid #110e06; }

    /* Page entry animation — only runs when user hasn't opted out of motion */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .fade-up { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
    }

    /* Chat message entry — opacity only, no movement (messages appear frequently) */
    .chat-msg-enter {
      animation: fadeIn 150ms ease-out both;
    }
    @media (prefers-reduced-motion: reduce) {
      .chat-msg-enter { animation: none; }
    }

    /* Modal backdrop */
    .modal-backdrop {
      animation: fadeIn 150ms ease-out both;
    }

    /* Hint item entry */
    @keyframes hintSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .hint-item { animation: hintSlideIn 200ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    }

    /* Sequential fade dots (iMessage style) */
    @keyframes dotFade {
      0%, 60%, 100% { opacity: 0.2; transform: scale(0.85); }
      30%            { opacity: 1;   transform: scale(1); }
    }
    .dot-fade {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      animation: dotFade 1.4s ease-in-out infinite;
    }

    /* Hint button idle wiggle */
    @keyframes hintWiggle {
      0%   { transform: rotate(0deg); }
      15%  { transform: rotate(-12deg); }
      30%  { transform: rotate(10deg); }
      45%  { transform: rotate(-8deg); }
      60%  { transform: rotate(6deg); }
      75%  { transform: rotate(-3deg); }
      100% { transform: rotate(0deg); }
    }
    .hint-wiggle {
      animation: hintWiggle 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      transform-origin: bottom center;
    }

    /* Sibling nav arrows */
    .sibling-nav-btn {
      transition: transform 120ms ease-out, opacity 120ms ease-out;
    }
    .sibling-nav-btn:not(:disabled):hover { transform: scale(1.15); }
    .sibling-nav-btn:not(:disabled):active { transform: scale(0.9); }

    /* Table row hover */
    .attempts-row {
      transition: background-color 100ms ease;
    }
    .attempts-row:hover { background-color: rgba(240, 231, 214, 0.6); }

    /* Login page doodles */
    .doodle { opacity: 0.5; }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e8e0d0 25%, #f5ede0 50%, #e8e0d0 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 8px;
    }

    /* Page transition */
    .page-wrap {
      transition: opacity 150ms ease-out;
    }
    .page-wrap.page-exit {
      opacity: 0;
    }

    /* Answer reveal */
    @keyframes answerReveal {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .answer-reveal { animation: answerReveal 350ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    }

    /* Active Lesson badge pulse */
    @keyframes lessonPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(110, 82, 117, 0.4); }
      50%       { box-shadow: 0 0 0 6px rgba(110, 82, 117, 0); }
    }
    .lesson-pulse {
      animation: lessonPulse 2.4s ease-in-out infinite;
    }

    /* Button transition utility — replaces transition-all on interactive elements */
    .btn-transition {
      transition: box-shadow 150ms ease-out, transform 150ms ease-out;
    }

    /* ── Background texture patterns ─────────────────────────────────── */

    /* Dot grid — Login page */
    .bg-dot-grid {
      background-image: radial-gradient(circle, rgba(17,14,6,0.13) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
    }

    /* Cross-hatch (graph paper) — Home page */
    .bg-dot-grid {
      background-image:
        linear-gradient(rgba(17,14,6,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17,14,6,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Diagonal stripes — Topics page */
    .bg-dot-grid {
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 16px,
        rgba(17,14,6,0.045) 16px,
        rgba(17,14,6,0.045) 18px
      );
    }

    /* Large dot grid — Dashboard */
    .bg-dot-grid {
      background-image: radial-gradient(circle, rgba(17,14,6,0.1) 1.5px, transparent 1.5px);
      background-size: 36px 36px;
    }

    /* Global base */
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #fef6e7;
      color: #322e25;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; }

    /* Focus-visible ring — keyboard navigation */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2.5px solid #6e5275;
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* Chip transition — includes background-color for topic filter tabs */
    .chip-transition {
      transition: background-color 150ms ease-out, box-shadow 150ms ease-out, transform 150ms ease-out;
    }

    /* Mobile panel tabs for split-view question page */
    .panel-tab-active {
      background-color: #f5d1fb;
      color: #110e06;
      font-weight: 800;
    }
    .panel-tab-inactive {
      color: #605b50;
    }
    .panel-tab-inactive:hover {
      background-color: #f0e7d6;
    }

    /* Question page: responsive split-panel container */
    .question-panels {
      display: flex;
      overflow: hidden;
      height: calc(100vh - 64px);
    }
    @media (max-width: 767px) {
      .question-panels {
        display: block;
        height: auto;
        overflow: visible;
      }
      .question-panel-left,
      .question-panel-right {
        width: 100% !important;
      }
      .question-panel-right {
        height: calc(100svh - 109px);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = '/api';

    function renderMarkdown(text) {
      const html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code style="background:rgba(0,0,0,0.07);padding:0.1em 0.3em;border-radius:4px;font-family:monospace;font-size:0.85em">$1</code>')
        .replace(/\n/g, '<br/>');
      return { __html: html };
    }

    const getToken   = () => localStorage.getItem('tutorly_token');
    const getStudent = () => { try { return JSON.parse(localStorage.getItem('tutorly_student') || 'null'); } catch { return null; } };
    const setAuth    = (s) => { localStorage.setItem('tutorly_token', s.session_token); localStorage.setItem('tutorly_student', JSON.stringify(s)); };
    const clearAuth  = () => { localStorage.removeItem('tutorly_token'); localStorage.removeItem('tutorly_student'); };

    async function api(path, opts = {}) {
      const token = getToken();
      const headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}), ...(opts.headers || {}) };
      const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function parseHash() {
      const raw = window.location.hash.replace(/^#/, '') || '';
      const [page, qs] = raw.split('?');
      const params = {};
      if (qs) qs.split('&').forEach(p => { const [k, v] = p.split('='); params[k] = decodeURIComponent(v || ''); });
      return { page: page || 'home', params };
    }
    function navigate(page, params = {}) {
      const qs = Object.keys(params).length ? '?' + Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&') : '';
      window.location.hash = `#${page}${qs}`;
    }

    /* ── Navbar ─────────────────────────────────────────────────────── */
    function Navbar({ page }) {
      const student = getStudent();
      return (
        <nav className="bg-surface border-b-2 border-[#110e06] sticky top-0 z-50 flex justify-between items-center px-6 py-4">
          <div className="flex items-center gap-8">
            <span className="font-headline font-black text-2xl italic tracking-tight text-[#110e06]">
              Tutorly
            </span>
            <div className="hidden md:flex gap-6 items-center">
              <a
                href="#home"
                className={`font-bold text-sm [transition:color_120ms_ease,transform_120ms_ease] hover:translate-x-[2px] hover:translate-y-[2px] ${page === 'home' ? 'border-b-4 border-[#110e06] text-[#110e06]' : 'text-on-surface hover:text-primary'}`}
              >
                Home
              </a>
              <a
                href="#dashboard"
                className={`font-bold text-sm [transition:color_120ms_ease,transform_120ms_ease] hover:translate-x-[2px] hover:translate-y-[2px] ${page === 'dashboard' ? 'border-b-4 border-[#110e06] text-[#110e06]' : 'text-on-surface hover:text-primary'}`}
              >
                Dashboard
              </a>
            </div>
          </div>
          <div className="flex items-center gap-3">
            {student && (
              <span className="bg-surface-container-lowest scribble-border px-3 py-1 rounded-lg font-bold text-sm neo-shadow-sm">
                {student.name}
              </span>
            )}
            <button
              className="bg-surface-container scribble-border px-3 py-1 rounded-lg font-bold text-sm neo-shadow-hover neo-shadow-active btn-transition"
              onClick={() => { clearAuth(); navigate('login'); }}
            >
              Logout
            </button>
          </div>
        </nav>
      );
    }

    /* ── Login ──────────────────────────────────────────────────────── */
    function LoginPage() {
      const [name,    setName]    = React.useState('');
      const [email,   setEmail]   = React.useState('');
      const [error,   setError]   = React.useState('');
      const [loading, setLoading] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name.trim() || !email.trim()) { setError('Please enter your name and email.'); return; }
        setLoading(true); setError('');
        try {
          const student = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ name: name.trim(), email: email.trim().toLowerCase() }),
          });
          setAuth(student);
          navigate('home');
        } catch (err) {
          setError(err.message || 'Something went wrong. Please try again.');
        } finally { setLoading(false); }
      };

      return (
        <div className="min-h-screen bg-primary-container bg-dot-grid font-body text-on-surface flex flex-col overflow-x-hidden">
          {/* Simplified header */}
          <header className="bg-surface border-b-2 border-[#110e06] flex justify-between items-center px-6 py-4">
            <span className="font-headline font-black text-2xl italic tracking-tight text-[#110e06]">Tutorly</span>
          </header>

          <main className="flex-grow flex items-center justify-center p-6 relative">
            {/* Doodle — large purple star, top-left near the heading */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ top: '7%', left: '18%', transform: 'rotate(-18deg)' }}>
              <svg width="80" height="80" viewBox="0 0 90 90" fill="none">
                <path d="M45 5 L49 38 L82 35 L55 52 L68 83 L45 62 L22 83 L35 52 L8 35 L41 38 Z" stroke="#6e5275" strokeWidth="2.5" strokeLinejoin="round" fill="#f5d1fb" fillOpacity="0.7"/>
              </svg>
            </div>

            {/* Doodle — wavy scribble 1, just above and right of heading */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ top: '4%', left: '58%', transform: 'rotate(4deg)' }}>
              <svg width="130" height="22" viewBox="0 0 130 22" fill="none">
                <path d="M4 14 C18 4 36 20 56 11 C76 2 98 18 126 8" stroke="#6e5275" strokeWidth="2.2" strokeLinecap="round" fill="none" opacity="0.45"/>
              </svg>
            </div>

            {/* Doodle — small teal star, right side next to the card */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ top: '42%', right: '17%', transform: 'rotate(22deg)' }}>
              <svg width="44" height="44" viewBox="0 0 52 52" fill="none">
                <path d="M26 4 L28.5 22 L46 20 L32 28 L40 46 L26 36 L12 46 L20 28 L6 20 L23.5 22 Z" stroke="#2a646a" strokeWidth="2" strokeLinejoin="round" fill="#aee7ee" fillOpacity="0.65"/>
              </svg>
            </div>

            {/* Doodle — wavy scribble 2, left side just beside the card */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ top: '52%', left: '16%', transform: 'rotate(-10deg)' }}>
              <svg width="100" height="22" viewBox="0 0 110 22" fill="none">
                <path d="M4 14 C16 4 30 20 50 10 C70 2 90 18 106 9" stroke="#2a646a" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.45"/>
              </svg>
            </div>

            {/* Doodle — curved arrow, left side pointing toward the card */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ top: '63%', left: '20%', transform: 'rotate(-8deg)' }}>
              <svg width="90" height="75" viewBox="0 0 100 90" fill="none">
                <path d="M15 80 C10 40 50 10 85 20" stroke="#47624b" strokeWidth="2.5" strokeLinecap="round" fill="none"/>
                <path d="M78 10 L88 22 L73 24" stroke="#47624b" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
              </svg>
            </div>

            {/* Doodle — wavy scribble 3, below the card center-right */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ bottom: '10%', left: '52%', transform: 'rotate(-5deg)' }}>
              <svg width="150" height="22" viewBox="0 0 160 22" fill="none">
                <path d="M4 14 C22 4 42 20 70 10 C98 1 124 18 156 9" stroke="#47624b" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.4"/>
              </svg>
            </div>

            {/* Doodle — plus cluster, top-right not corner */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ top: '18%', right: '12%', transform: 'rotate(8deg)' }}>
              <svg width="65" height="60" viewBox="0 0 80 70" fill="none">
                <line x1="20" y1="10" x2="20" y2="30" stroke="#6e5275" strokeWidth="2.5" strokeLinecap="round"/>
                <line x1="10" y1="20" x2="30" y2="20" stroke="#6e5275" strokeWidth="2.5" strokeLinecap="round"/>
                <line x1="55" y1="42" x2="55" y2="54" stroke="#2a646a" strokeWidth="2" strokeLinecap="round"/>
                <line x1="49" y1="48" x2="61" y2="48" stroke="#2a646a" strokeWidth="2" strokeLinecap="round"/>
                <circle cx="44" cy="12" r="3" fill="#47624b" fillOpacity="0.45"/>
              </svg>
            </div>

            {/* Doodle — wavy scribble 4, top-right edge (short) */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ top: '30%', right: '5%', transform: 'rotate(15deg)' }}>
              <svg width="80" height="20" viewBox="0 0 90 20" fill="none">
                <path d="M4 14 C16 4 30 18 50 10 C66 3 78 16 86 9" stroke="#6e5275" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.4"/>
              </svg>
            </div>

            {/* Doodle — dashed circle, bottom-left floating */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ bottom: '20%', left: '8%', transform: 'rotate(12deg)' }}>
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="16" stroke="#2a646a" strokeWidth="2.5" strokeDasharray="5 4" opacity="0.5"/>
              </svg>
            </div>

            {/* Doodle — small green star, bottom-right area */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ bottom: '15%', right: '22%', transform: 'rotate(30deg)' }}>
              <svg width="34" height="34" viewBox="0 0 52 52" fill="none">
                <path d="M26 4 L28.5 22 L46 20 L32 28 L40 46 L26 36 L12 46 L20 28 L6 20 L23.5 22 Z" stroke="#47624b" strokeWidth="2" strokeLinejoin="round" fill="#ddfcde" fillOpacity="0.7"/>
              </svg>
            </div>

            {/* Doodle — wavy scribble 5, bottom-left corner short */}
            <div className="hidden lg:block absolute select-none pointer-events-none doodle" style={{ bottom: '7%', left: '12%', transform: 'rotate(-8deg)' }}>
              <svg width="90" height="20" viewBox="0 0 100 20" fill="none">
                <path d="M4 14 C16 5 30 18 50 10 C68 3 84 16 96 9" stroke="#6e5275" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.35"/>
              </svg>
            </div>

            {/* Login container */}
            <div className="max-w-md w-full flex flex-col gap-8 relative z-10">
              <div className="text-center space-y-2 fade-up">
                <h1 className="font-headline font-extrabold text-4xl md:text-5xl text-[#110e06] tracking-tight leading-tight">
                  Learn it, don't memorize.
                </h1>
                <p className="text-lg font-medium opacity-80">
                  Practice predicted O-Level questions with an AI tutor that guides your thinking.
                </p>
              </div>

              {/* Login card */}
              <div className="bg-surface scribble-border rounded-[2rem] p-8 md:p-10 neo-shadow fade-up" style={{ animationDelay: '80ms' }}>
                <h2 className="font-headline font-black text-xl text-[#110e06] mb-6">Start studying →</h2>

                {error && (
                  <div className="error-banner bg-error-container scribble-border rounded-xl px-4 py-3 font-bold text-sm text-on-error-container mb-4">
                    {error}
                  </div>

    /* ── Question card with animated probability bar ────────────────── */
    function QuestionCard({ q, idx, cardFills, difficultyColors }) {
      const barRef = React.useRef(null);
      const [inView, setInView] = React.useState(false);

      React.useEffect(() => {
        const el = barRef.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) { setInView(true); observer.disconnect(); } },
          { threshold: 0.5 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      return (
        <div
          className={`${cardFills[idx % cardFills.length]} scribble-border rounded-2xl p-6 flex flex-col h-full neo-shadow neo-shadow-hover neo-shadow-active btn-transition cursor-pointer fade-up`}
          style={{ animationDelay: `${Math.min(idx * 45, 300)}ms` }}

              {q.difficulty}

            <div className="flex gap-1 flex-wrap justify-end">
              {(q.years_appeared || []).map(y => (
                <span key={y} className="px-2 py-1 bg-[#110e06] text-white text-[10px] font-bold rounded">{y}</span>
              ))}

            {q.topic_name}

            {q.question_text.length > 140 ? q.question_text.slice(0, 140) + '…' : q.question_text}

          {/* Probability bar */}
          <div className="mt-auto pt-6 border-t-2 border-[#110e06]/10">
            <div className="flex justify-between items-end mb-2">
              <span className="text-sm font-bold uppercase tracking-tight text-on-surface-variant">Predicted Probability</span>

              <div
                className="h-full bg-secondary"
                style={{
                  width: inView ? `${q.predicted_score}%` : '0%',

          </div>
        </div>
      );

    /* ── Question room ──────────────────────────────────────────────── */
    function QuestionPage({ params }) {
  const questionId = parseInt(params.id, 10);
  const [panelVisible, setPanelVisible] = React.useState(true);

  // Briefly fade the left panel when switching between sibling parts
  React.useEffect(() => {
    setPanelVisible(false);
    const t = setTimeout(() => setPanelVisible(true), 120);
    return () => clearTimeout(t);
  }, [questionId]);

  const [question,     setQuestion]     = React.useState(null);
  const [messages,     setMessages]     = React.useState([]);
  const [input,        setInput]        = React.useState('');
  const [sending,      setSending]      = React.useState(false);
  const [attemptId,    setAttemptId]    = React.useState(null);
  const [sessionId,    setSessionId]    = React.useState(null);
  const [loading,      setLoading]      = React.useState(true);
  const [error,        setError]        = React.useState('');
  const [showModal,    setShowModal]    = React.useState(false);
  const [confidence,   setConfidence]   = React.useState(0);
  const [submitting,   setSubmitting]   = React.useState(false);
  const [showAnswer,   setShowAnswer]   = React.useState(false);
  const [hintsRevealed, setHintsRevealed] = React.useState(0);
  const [activePanel,  setActivePanel]  = React.useState('question'); // mobile: 'question' | 'chat'

  const messagesEndRef = React.useRef(null);
  const hintTimerRef   = React.useRef(null);
  const [hintWiggling, setHintWiggling] = React.useState(false);

  const scheduleHintWiggle = () => {
    clearTimeout(hintTimerRef.current);
    hintTimerRef.current = setTimeout(() => {
      setHintWiggling(true);
      setTimeout(() => { setHintWiggling(false); scheduleHintWiggle(); }, 700);
    }, 10000);
  };

  // Start idle timer once question is loaded
  React.useEffect(() => {
    if (question) scheduleHintWiggle();
    return () => clearTimeout(hintTimerRef.current);
  }, [question]);

  React.useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  React.useEffect(() => {
    (async () => {
      try {
        const q       = await api(`/questions/${questionId}`);
        const attempt = await api('/attempts', { method: 'POST', body: JSON.stringify({ question_id: questionId }) });
        const session = await api('/chat/session', { method: 'POST', body: JSON.stringify({ question_id: questionId, attempt_id: attempt.id }) });
        const history = await api(`/chat/session/${session.id}/messages`);
        setQuestion(q); setAttemptId(attempt.id); setSessionId(session.id);
        if (history.length > 0) setMessages(history.map(m => ({ role: m.role, content: m.content })));
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
    })();
  }, [questionId]);

  const sendMessage = async (text) => {
    const msg = text || input.trim();
    if (!msg || sending) return false;
    setInput('');
    setActivePanel('chat'); // ensure chat is visible on mobile after sending
    scheduleHintWiggle(); // reset idle timer on every send
    setMessages(prev => [...prev, { role: 'user', content: msg }, { role: 'thinking' }]);
    setSending(true);
    try {
      const res = await api(`/chat/session/${sessionId}/message`, {
        method: 'POST',
        body: JSON.stringify({ message: msg }),
      });
      setMessages(prev => prev.filter(m => m.role !== 'thinking').concat({ role: 'assistant', content: res.content }));
      return true;
    } catch {
      setMessages(prev => prev.filter(m => m.role !== 'thinking').concat({ role: 'assistant', content: '⚠️ Could not reach the AI. Please try again.' }));
      return false;
    } finally { setSending(false); }
  };

  const handleDone = async () => {
    if (!confidence) { setShowModal(true); return; }
    setSubmitting(true);
    try {
      await api(`/attempts/${attemptId}`, {
        method: 'PATCH',
        body: JSON.stringify({ self_rated_confidence: confidence, completed_at: new Date().toISOString() }),
      });
      setShowModal(false); setShowAnswer(true);
    } finally { setSubmitting(false); }
  };

  if (loading) return (
    <>
      <Navbar page="question" />
      <div className="question-panels">
        <section className="question-panel-left w-1/2 bg-surface bg-dot-grid border-r-2 border-[#110e06] p-6 md:p-8 flex flex-col gap-4">
          <div className="flex justify-between items-center mb-2">
            <div className="skeleton h-9 w-20 rounded-xl" />
            <div className="skeleton h-7 w-28 rounded-full" />
            <div className="skeleton h-9 w-24 rounded-xl" />
          </div>
          <div className="skeleton h-4 w-48" />
          <div className="bg-surface-container-lowest scribble-border rounded-2xl p-6 flex flex-col gap-3">
            <div className="flex gap-2"><div className="skeleton h-6 w-16 rounded-lg" /><div className="skeleton h-6 w-20 rounded-lg" /></div>
            <div className="skeleton h-5 w-full" />
            <div className="skeleton h-5 w-full" />
            <div className="skeleton h-5 w-3/4" />
          </div>
        </section>
        <section className="question-panel-right w-1/2 bg-surface-container-low flex flex-col">
          <div className="bg-surface border-b-2 border-[#110e06] flex items-center gap-3 px-5 py-3">
            <div className="skeleton w-10 h-10 rounded-full" />
            <div className="flex flex-col gap-1"><div className="skeleton h-4 w-28" /><div className="skeleton h-3 w-20" /></div>
          </div>
          <div className="flex-grow p-5 flex flex-col gap-4">
            <div className="skeleton h-16 w-4/5 rounded-2xl" />
          </div>
          <div className="bg-surface border-t-2 border-[#110e06] p-4">
            <div className="skeleton h-14 w-full rounded-xl" />
          </div>
        </section>
      </div>
    </>
  );

  if (error) return (
    <>
      <Navbar page="question" />
      <div className="max-w-7xl mx-auto px-6 py-12">
        <div className="bg-error-container scribble-border rounded-xl px-4 py-3 font-bold text-sm text-on-error-container">{error}</div>
      </div>
    </>
  );

  return (
    <>
      <Navbar page="question" />

      {/* ── Mobile panel switcher — hidden on md+ ─────────── */}
      <div className="md:hidden flex bg-surface border-b-2 border-[#110e06] sticky top-[65px] z-40">
        <button
          onClick={() => setActivePanel('question')}
          className={`flex-1 py-3 font-headline font-bold text-sm chip-transition ${activePanel === 'question' ? 'panel-tab-active' : 'panel-tab-inactive'}`}
        >
          Question
        </button>
        <button
          onClick={() => { setActivePanel('chat'); }}
          className={`flex-1 py-3 font-headline font-bold text-sm chip-transition ${activePanel === 'chat' ? 'panel-tab-active' : 'panel-tab-inactive'}`}
        >
          AI Tutor
        </button>
      </div>

      <div className="question-panels">

        {/* ── Left: Question Panel ───────────────────────────── */}

          {/* Input area */}
          <div className="bg-surface border-t-2 border-[#110e06] p-4">
            <div className="flex gap-3">

                className="input-field flex-grow bg-surface-container-lowest scribble-border rounded-xl p-4 font-medium resize-none outline-none placeholder:text-outline-variant"
                placeholder="Type your answer here…"

                value={input}
                style={{ minHeight: '58px', maxHeight: '160px', overflowY: 'auto' }}
                onChange={e => {
                  setInput(e.target.value);

                }}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); e.target.style.height = '58px'; } }}
              />
              <button
                aria-label="Send message"
                className="bg-primary scribble-border rounded-xl p-4 neo-shadow neo-shadow-hover neo-shadow-active btn-transition flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"

              >
                <span className="material-symbols-outlined text-on-primary">send</span>
              </button>
            </div>
            <p className="text-[10px] font-headline font-black uppercase tracking-tight text-outline text-right mt-2">

            </p>
          </div>
        </section>
      </div>

      {/* ── Confidence modal ──────────────────────────────── */}
      {showModal && (
        <div
          className="modal-backdrop fixed inset-0 z-50 bg-[#110e06]/40 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}
        >
          <div className="bg-surface scribble-border rounded-[2rem] p-8 neo-shadow max-w-sm w-full text-center fade-up">
            <h2 className="font-headline font-black text-2xl mb-2 text-[#110e06]">How confident do you feel?</h2>
            <p className="font-medium text-on-surface-variant mb-6">Rate your understanding before moving on.</p>
            <div className="flex justify-center gap-3 mb-6">
              {[1,2,3,4,5].map(n => (

                  key={n}
                  onClick={() => setConfidence(n)}

            <div className="flex gap-3 justify-center">

                Cancel
              </button>

              >

              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

    /* ── Count-up hook ──────────────────────────────────────────────── */
    function useCountUp(target, duration = 900) {
      const [value, setValue] = React.useState(0);
      React.useEffect(() => {
        if (target == null || isNaN(Number(target))) { setValue(target); return; }
        const end = parseFloat(target);
        const startTime = performance.now();
        const tick = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // ease-out cubic
          const eased = 1 - Math.pow(1 - progress, 3);
          setValue(Number.isInteger(end) ? Math.round(eased * end) : (eased * end).toFixed(1));
          if (progress < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }, [target]);
      return value;
    }

    function StatCard({ fill, label, value, delay }) {
      const animated = useCountUp(value);
      return (
        <div className={`${fill} scribble-border rounded-xl p-6 neo-shadow fade-up`} style={{ animationDelay: `${delay}ms` }}>
          <p className="text-xs font-headline font-black uppercase tracking-widest text-on-surface-variant mb-2">{label}</p>
          <p className="font-headline font-black text-5xl tracking-tight text-[#110e06]">{animated}</p>
        </div>
      );
    }

              {data.recent_attempts.length === 0 ? (
                <div className="text-center py-8 flex flex-col items-center gap-2">
                  <span className="material-symbols-outlined text-5xl text-outline-variant" style={{ fontVariationSettings: "'FILL' 1, 'opsz' 48" }}>history_edu</span>
                  <p className="font-body text-on-surface-variant font-bold">No attempts yet</p>
                  <p className="text-sm text-outline">Complete a question to see your history here.</p>
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-surface-container-high">
                        <th className="text-left px-4 py-3 font-headline font-black text-xs uppercase tracking-widest opacity-60 rounded-tl-lg">Question</th>
                        <th className="text-left px-4 py-3 font-headline font-black text-xs uppercase tracking-widest opacity-60">Subject</th>
                        <th className="text-left px-4 py-3 font-headline font-black text-xs uppercase tracking-widest opacity-60">Confidence</th>
                        <th className="text-left px-4 py-3 font-headline font-black text-xs uppercase tracking-widest opacity-60 rounded-tr-lg">Date</th>
                      </tr>
                    </thead>
                    <tbody>
                      {data.recent_attempts.map((a, i) => (
                        <tr key={i} className="attempts-row border-t-2 border-[#110e06]/10">
                          <td className="px-4 py-3 max-w-xs font-medium">
                            {a.question_text.length > 80 ? a.question_text.slice(0, 80) + '…' : a.question_text}
                          </td>
                          <td className="px-4 py-3 font-bold text-on-surface-variant">{a.subject_name}</td>
                          <td className="px-4 py-3" aria-label={a.self_rated_confidence ? `${a.self_rated_confidence} out of 5` : 'Not rated'}>
                            {a.self_rated_confidence ? '⭐'.repeat(a.self_rated_confidence) : '—'}
                          </td>
                          <td className="px-4 py-3 text-xs text-outline">
                            {new Date(a.completed_at).toLocaleDateString()}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

          </div>
        </div>
      </main>
    </>
  );
}

    /* ── App router ─────────────────────────────────────────────────── */
    function App() {
      const [route,   setRoute]   = useState(parseHash());
      const [visible, setVisible] = useState(true);
      const routeRef = React.useRef(route);
      routeRef.current = route;

      useEffect(() => {
        const onHash = () => {
          const newRoute = parseHash();
          const samePageType = newRoute.page === routeRef.current.page;
          if (samePageType) {
            // Same page (e.g. question → question): update instantly, no fade
            setRoute(newRoute);
          } else {
            setVisible(false);
            setTimeout(() => {
              setRoute(newRoute);
              setVisible(true);
            }, 150);
          }
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const { page, params } = route;
      const token = getToken();

      if (!token && page !== 'login') { setTimeout(() => navigate('login'), 0); return null; }
      if (token  && page === 'login') { setTimeout(() => navigate('home'),  0); return null; }

      let content = null;
      if (page === 'login')     content = <LoginPage />;
      else if (page === 'home')      content = <HomePage />;
      else if (page === 'topics')    content = <TopicsPage params={params} />;
      else if (page === 'question')  content = <QuestionPage params={params} />;
      else if (page === 'dashboard') content = <DashboardPage />;
      else { setTimeout(() => navigate('home'), 0); return null; }

      return (
        <div className={`page-wrap${visible ? '' : ' page-exit'}`}>
          {content}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
